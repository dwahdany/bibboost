[project]
name = "bib-updater"
version = "0.1.0"
description = "Update BibTeX entries with published conference versions from DBLP"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "bibtexparser>=1.4.3",
    "click>=8.3.0",
    "python-dotenv>=1.1.1",
    "questionary>=2.1.1",
    "requests>=2.32.5",
    "tenacity>=9.1.2",
]

[project.scripts]
bib-updater = "main:cli"

[tool.setuptools]
py-modules = ["main", "bib_updater", "dblp_client"]
